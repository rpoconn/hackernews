# -----------------------------------------------------------------------------
# Hacker News API v0 — OpenAPI 3.1 description
#
# Hacker News does not publish an OpenAPI spec. This file was transcribed by
# hand from the official documentation (https://github.com/HackerNews/API) and
# checked against live responses (Nov 2026). It is the single source of truth
# for the generated client in `src/api/hn/generated/`; regenerate with
# `npm run openapi:generate` after editing it.
#
# Quirks of the real API worth knowing:
#  - Every path ends in `.json` (it is a Firebase Realtime Database export).
#  - Unknown items and users return HTTP 200 with a JSON `null` body, not 404.
#  - Deleted / dead items keep their `id` but lose most other fields, so only
#    `id` is required on `Item`.
#  - The docs say clients must ignore unexpected fields, so schemas allow them.
# -----------------------------------------------------------------------------
openapi: 3.1.0
info:
    title: Hacker News API
    version: v0
    description: >-
        Public, read-only Hacker News data served from Firebase. There is
        currently no rate limit and no authentication.
    license:
        name: MIT
        url: https://github.com/HackerNews/API/blob/master/LICENSE
externalDocs:
    url: https://github.com/HackerNews/API
servers:
    - url: https://hacker-news.firebaseio.com/v0

tags:
    - name: items
    - name: users
    - name: live

paths:
    # --- Items ---------------------------------------------------------------
    /item/{id}.json:
        get:
            operationId: getItem
            summary: Get an item (story, comment, job, poll or pollopt)
            tags: [items]
            parameters:
                - $ref: '#/components/parameters/ItemId'
            responses:
                '200':
                    description: The item, or `null` if no item has this ID.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Item'
                                    - type: 'null'

    # --- Users ---------------------------------------------------------------
    /user/{id}.json:
        get:
            operationId: getUser
            summary: Get a user with public activity
            tags: [users]
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Case-sensitive username.
                  schema:
                      type: string
            responses:
                '200':
                    description: The user, or `null` if the user does not exist.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/User'
                                    - type: 'null'

    # --- Live data -----------------------------------------------------------
    /maxitem.json:
        get:
            operationId: getMaxItem
            summary: Get the current largest item ID
            tags: [live]
            responses:
                '200':
                    description: The largest item ID.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ItemId'

    /topstories.json:
        get:
            operationId: getTopStories
            summary: Up to 500 top stories (also contains jobs)
            tags: [live]
            responses:
                '200':
                    $ref: '#/components/responses/ItemIdList'

    /newstories.json:
        get:
            operationId: getNewStories
            summary: Up to 500 newest stories
            tags: [live]
            responses:
                '200':
                    $ref: '#/components/responses/ItemIdList'

    /beststories.json:
        get:
            operationId: getBestStories
            summary: Up to 500 best stories
            tags: [live]
            responses:
                '200':
                    $ref: '#/components/responses/ItemIdList'

    /askstories.json:
        get:
            operationId: getAskStories
            summary: Up to 200 latest Ask HN stories
            tags: [live]
            responses:
                '200':
                    $ref: '#/components/responses/ItemIdList'

    /showstories.json:
        get:
            operationId: getShowStories
            summary: Up to 200 latest Show HN stories
            tags: [live]
            responses:
                '200':
                    $ref: '#/components/responses/ItemIdList'

    /jobstories.json:
        get:
            operationId: getJobStories
            summary: Up to 200 latest job stories, newest first
            tags: [live]
            responses:
                '200':
                    $ref: '#/components/responses/ItemIdList'

    /updates.json:
        get:
            operationId: getUpdates
            summary: Recently changed items and profiles
            tags: [live]
            responses:
                '200':
                    description: IDs of changed items and usernames of changed profiles.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Updates'

components:
    parameters:
        ItemId:
            name: id
            in: path
            required: true
            description: The item's unique ID.
            schema:
                $ref: '#/components/schemas/ItemId'

    responses:
        ItemIdList:
            description: Item IDs in display order.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ItemIdList'

    schemas:
        ItemId:
            type: integer
            minimum: 1

        ItemIdList:
            type: array
            items:
                $ref: '#/components/schemas/ItemId'

        ItemType:
            type: string
            enum: [job, story, comment, poll, pollopt]

        Item:
            description: >-
                Stories, comments, jobs, Ask HNs and polls are all items. Only
                `id` is guaranteed; deleted or dead items omit most fields.
            type: object
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/ItemId'
                deleted:
                    description: '`true` if the item is deleted.'
                    type: boolean
                type:
                    $ref: '#/components/schemas/ItemType'
                by:
                    description: Username of the item's author.
                    type: string
                time:
                    description: Creation date, in Unix time (seconds).
                    type: integer
                    minimum: 0
                text:
                    description: Comment, story or poll text. HTML.
                    type: string
                dead:
                    description: '`true` if the item is dead.'
                    type: boolean
                parent:
                    description: A comment's parent (another comment or the story).
                    $ref: '#/components/schemas/ItemId'
                poll:
                    description: A pollopt's associated poll.
                    $ref: '#/components/schemas/ItemId'
                kids:
                    description: IDs of the item's comments, in ranked display order.
                    $ref: '#/components/schemas/ItemIdList'
                url:
                    description: >-
                        The URL of the story. Older inline job postings use an
                        empty string.
                    type: string
                score:
                    description: The story's score, or the votes for a pollopt.
                    type: integer
                title:
                    description: Title of the story, poll or job. HTML.
                    type: string
                parts:
                    description: Related pollopts, in display order.
                    $ref: '#/components/schemas/ItemIdList'
                descendants:
                    description: For stories or polls, the total comment count.
                    type: integer
                    minimum: 0

        User:
            type: object
            required: [id, created, karma]
            properties:
                id:
                    description: Unique, case-sensitive username.
                    type: string
                created:
                    description: Creation date, in Unix time (seconds).
                    type: integer
                    minimum: 0
                karma:
                    type: integer
                about:
                    description: Optional self-description. HTML.
                    type: string
                submitted:
                    description: The user's stories, polls and comments.
                    $ref: '#/components/schemas/ItemIdList'

        Updates:
            type: object
            required: [items, profiles]
            properties:
                items:
                    $ref: '#/components/schemas/ItemIdList'
                profiles:
                    type: array
                    items:
                        type: string
